<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PagaAí</title>
<meta name="description" content="Prestação de contas: fotografe as notas, acompanhe o saldo do adiantamento e gere o PDF.">
<meta name="theme-color" content="#0B7A5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PagaAí">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: coluna única de bolso — cabeçalho com total e saldo do adiantamento, gráfico de saldo por dia, despesas agrupadas por dia, barra de ação fixa */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16233A; --muted:#5E6B7E; --line:#D9DFE6;
  --accent:#0B7A5E; --accent-ink:#FFFFFF; --accent-soft:#DDF1EA; --warn:#B45F06; --warn-soft:#FBEBD6; --danger:#B3261E; --paper:#FBFCFD;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F151E; --surface:#18212D; --ink:#E6ECF3; --muted:#93A1B3; --line:#2A3544;
  --accent:#3CC79E; --accent-ink:#06261C; --accent-soft:#143A30; --warn:#F0B062; --warn-soft:#3A2A14; --danger:#F2867E; --paper:#1D2734; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font-family:var(--f-sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.brand img{width:26px;height:26px;border-radius:7px}
.tools{display:flex;gap:8px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.iconbtn svg{width:18px;height:18px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.head{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 20px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.head::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:8px;background:radial-gradient(circle at 6px 8px,var(--bg) 5px,transparent 5.5px) 0 0/12px 8px repeat-x}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.title{font-size:20px;font-weight:700;text-wrap:balance;margin:0}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.totalrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px dashed var(--line);padding-top:10px}
.total{font-size:30px;font-weight:600;letter-spacing:-.01em}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.pill.open{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--line);color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.cat b{color:var(--ink);font-weight:600}
/* saldo do adiantamento */
.saldo{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.saldo .lbls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.saldo .lbls>div{min-width:0}
.saldo .lbls .v{font-weight:600;font-size:15px}
.saldo .lbls>div:last-child{text-align:right}
.gauge{position:relative;height:14px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.gauge .used{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.gauge.over{background:var(--warn-soft)}
.gauge.over .used{background:var(--warn)}
.saldo .msg{font-size:13px;font-weight:600}
.saldo .msg.pos{color:var(--accent)}
.saldo .msg.neg{color:var(--warn)}
.addadto{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
/* gráfico */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px}
.chart .hd{display:flex;flex-direction:column;gap:2px}
.chart .hd strong{font-size:14px}
.chart .scroll{overflow-x:auto}
.chart svg{display:block}
.chart .bar{transform-box:fill-box;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.chart .bar.up{transform-origin:50% 100%}
.chart .bar.down{transform-origin:50% 0%}
.chart.pre .bar{transform:scaleY(0)}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.chart text.val{fill:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.chart .bar,.gauge .used{transition:none}.chart.pre .bar{transform:none}}
.day{display:flex;flex-direction:column;gap:6px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);padding:0 2px}
.dayhead strong{color:var(--ink);font-weight:600;display:inline-block}
.dayhead strong::first-letter{text-transform:uppercase}
.items{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--bg);display:grid;place-items:center;color:var(--muted)}
.thumb svg{width:20px;height:20px}
.item .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:12px;color:var(--muted)}
.item .v{font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.rcard .t{font-weight:600}
.rcard .s{font-size:12px;color:var(--muted)}
.rcard .v{grid-row:span 2;align-self:center;text-align:right;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.second{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.scrim{position:fixed;inset:0;background:rgb(10 16 26 / .5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
.field input.money{font-family:var(--f-mono);font-size:20px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>*{min-width:0}
.photo{border-radius:10px;overflow:hidden;background:var(--bg);max-height:280px;display:flex;justify-content:center}
.photo img{max-height:280px;object-fit:contain}
.ocr{font-size:13px;border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center}
.ocr.run,.ocr.ok{background:var(--accent-soft);color:var(--accent)}
.ocr.low{background:var(--warn-soft);color:var(--warn)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.alc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.alc .lst{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.alc .lst button{display:flex;justify-content:space-between;gap:8px;background:none;border:0;padding:3px 0;text-align:left;font-size:12px;color:inherit}
.alc .lst button.off>span{text-decoration:line-through;opacity:.55}
.alc .lst .dv{color:var(--warn)}
.splithead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.segs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg{background:none;border:0;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg.on{background:var(--accent);color:var(--accent-ink)}
.splitbody{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px}
.chip b{font-weight:600}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .iconbtn{font-size:18px;line-height:1}
.reimbbox{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.reimbbox .reimb{border:0;padding:0}
.reimb{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);padding-top:8px}
.reimb .v{font-size:20px;font-weight:600;color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn.primary{flex:1}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:30;max-width:90%;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><img src="icon-192.png" alt="">PagaAí</div>
    <div class="tools">
      <button class="ghost" id="btnLista" hidden>Prestações</button>
      <button class="iconbtn" id="btnAjustes" aria-label="Ajustes"></button>
    </div>
  </div>
  <div id="view"><div class="empty">Carregando…</div></div>
</div>
<div class="dock" id="dock" hidden><div class="in" id="dockIn"></div></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" hidden>

<script>
(function(){
"use strict";
const CATS=["Alimentação","Combustível","Hospedagem","Transporte/Táxi/App","Pedágio","Estacionamento","Material/Peças","Outros"];
const MODELS=[["claude-sonnet-5-5","Sonnet (recomendado, lê melhor cupom apagado)"],["claude-haiku-5-5","Haiku (mais barato)"]];
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const r2=v=>Math.round((Number(v)||0)*100)/100;
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDay=iso=>{if(!iso)return"Sem data";const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"short"})};
const fmtDate=iso=>{if(!iso)return"—";const[y,m,d]=iso.split("-");return d+"/"+m+"/"+y};
const fmtDM=iso=>{if(!iso)return"s/d";const[,m,d]=iso.split("-");return d+"/"+m};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const parseMoney=s=>{if(typeof s==="number")return s;s=String(s||"").replace(/[^\d,.-]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?r2(n):0};
const moneyInput=v=>v?Number(v).toFixed(2).replace(".",","):"";
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?"":v)}for(const k of kids.flat()){if(k==null||k===false)continue;e.append(k.nodeType?k:document.createTextNode(String(k)))}return e};
const NS="http://www.w3.org/2000/svg";
const sv=(tag,attrs={},txt)=>{const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(txt!=null)e.textContent=txt;return e};
const ico=p=>{const s=sv("svg",{viewBox:"0 0 24 24",fill:"none",stroke:"currentColor","stroke-width":"2","stroke-linecap":"round","stroke-linejoin":"round"});s.innerHTML=p;return s};
const I={cam:'<path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/>',
gal:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 9"/>',
check:'<path d="M20 6 9 17l-5-5"/>',pdf:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6m-3-3 3 3 3-3"/>',
plus:'<path d="M12 5v14M5 12h14"/>',rec:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
share:'<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/>'};
function toast(msg,ms=2600){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=el("div",{class:"toast",role:"status"},msg);document.body.append(t);setTimeout(()=>t.remove(),ms)}
const CFG={get(){try{return JSON.parse(localStorage.getItem("pagaai_cfg")||"{}")}catch(_){return{}}},set(v){try{localStorage.setItem("pagaai_cfg",JSON.stringify(Object.assign(this.get(),v)))}catch(_){}}};

/* ---------- IndexedDB: tudo fica no aparelho ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const q=indexedDB.open("pagaai",1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore("reports",{keyPath:"id"});const s=d.createObjectStore("items",{keyPath:"id"});s.createIndex("rid","rid")};q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})},
  reports(){return this.tx("reports","readonly",s=>s.getAll())},
  putReport(r){return this.tx("reports","readwrite",s=>s.put(r))},
  items(rid){return this.tx("items","readonly",s=>s.index("rid").getAll(rid))},
  putItem(i){return this.tx("items","readwrite",s=>s.put(i))},
  allItems(){return this.tx("items","readonly",s=>s.getAll())},
  delItem(id){return this.tx("items","readwrite",s=>s.delete(id))},
  async delReport(r){const its=await this.items(r.id);for(const i of its)await this.delItem(i.id);return this.tx("reports","readwrite",s=>s.delete(r.id))}
};

/* Bebidas: soma dos itens + a parte da gorjeta/serviço que incide sobre elas.
   fator = gorjeta / (total pago - gorjeta) quando a gorjeta vem em linha própria; ou pct/100. */
function calcAlcool(lista,fator){
  const itens=lista.filter(x=>!x.taxa);const soma=r2(itens.filter(x=>!x.off).reduce((s,x)=>s+x.valor,0));
  const taxa=r2(soma*(fator||0));const out=itens.slice();
  if(fator)out.push({descricao:"Gorjeta/serviço proporcional às bebidas ("+(fator*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%)",valor:taxa,taxa:true});
  return{lista:out,valor:r2(soma+taxa)};
}
function fatorGorjeta(out){
  const g=Number(out.gorjeta_valor)||0,t=Number(out.valor_total)||0,p=Number(out.taxa_servico_percentual)||0;
  if(g>0&&t>g)return g/(t-g);
  return p>0&&p<=30?p/100:0;
}
/* ---------- estado ---------- */
let S={reports:[],current:null,items:[]};
const totalOf=items=>r2(items.reduce((s,i)=>s+(Number(i.valor)||0),0));
async function loadReports(){S.reports=(await DB.reports()).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0))}
async function openReport(r){S.current=r;S.items=await DB.items(r.id);renderReport()}

function setDock(...btns){$("#dockIn").replaceChildren(...btns);$("#dock").hidden=!btns.length}

async function renderList(){
  S.current=null;$("#btnLista").hidden=true;
  const v=$("#view");v.replaceChildren();
  const box=el("div",{class:"list"});
  if(!S.reports.length)box.append(el("div",{class:"empty"},el("div",{class:"title"},"Nenhuma prestação ainda"),"Abra uma prestação, informe o adiantamento, fotografe cada nota e finalize para gerar o PDF."));
  for(const r of S.reports){
    const its=await DB.items(r.id);const tot=totalOf(its);const adto=Number(r.adiantamento)||0;
    box.append(el("button",{class:"rcard",onclick:()=>openReport(r)},
      el("span",{class:"t"},r.titulo),el("span",{class:"v num"},brl(tot)),
      el("span",{class:"s"},el("span",{class:"pill "+(r.status==="finalizada"?"done":"open")},r.status==="finalizada"?"Finalizada":"Aberta")," ",its.length+" nota"+(its.length===1?"":"s")+(adto?" · saldo "+brl(adto-tot):""))));
  }
  v.append(box);

BEBIDAS ALCOÓLICAS (itens_alcool)
- Liste cada linha que é bebida alcoólica com o valor da linha. Se a nota mostrar "Acréscimo sobre item" e "Valor líquido" para a linha, use o VALOR LÍQUIDO. Se houver desconto na própria linha, use o valor depois do desconto.
- São alcoólicos: chope/chopp, cerveja, long neck (LN), garrafa/litrão, balde, CANECA (em bar/restaurante caneca é chope), "caneca zero grau"/"chopp zero grau"/"gelada" (zero grau é a TEMPERATURA, é chope normal), "CANECA HAPPY"/"CHOPP HAPPY"/"HAPPY HOUR" (é a caneca de chope do happy hour, NÃO é dúvida), vinho, taça, espumante, prosecco, sidra, saquê, caipirinha, caipiroska, caipisaquê, drinks, coquetéis, gin tônica, aperol, mojito, negroni, dose, destilados (vodka, whisky, cachaça, gin, rum, tequila, licor, conhaque) e marcas de cerveja (Heineken, Brahma, Skol, Stella Artois, Corona, Budweiser, Original, Amstel, Spaten, Eisenbahn, Itaipava, Petra, Colorado, Baden etc.).
- NÃO são bebida alcoólica: ETANOL / ÁLCOOL combustível de posto, álcool gel, álcool 70%; H2O/H2OH (refrigerante), refrigerante, suco, água, chá, ICE TEA, café, energético; cervejas explicitamente "sem álcool", "0,0%", "0.0" ou "zero álcool"; drinks marcados "sem álcool"/"mocktail".
- "duvida": true quando o nome não deixa claro (ex.: "BALDE PROMO", "COMBO", siglas que podem ser bebida ou não). Na dúvida, inclua com duvida true.
- Não coloque a gorjeta/serviço dentro de itens_alcool.

GORJETA / SERVIÇO
- gorjeta_valor = valor da gorjeta/taxa de serviço/"GORJETA"/"SERVIÇO"/"TX SERV"/"ACRÉSCIMO" quando ela aparece como linha própria ou como acréscimo no total E NÃO já está somada no valor de cada item. Se a nota usa "Valor líquido" por item (acréscimo já distribuído nos itens), gorjeta_valor = null.
- taxa_servico_percentual só se a nota mostrar o percentual e não mostrar o valor; senão null.
- Couvert artístico não é gorjeta.

OUTROS
- data: data de emissão (DD/MM/AAAA no Brasil).
- categoria: exatamente uma de: ${CATS.join(", ")}. Posto de combustível = Combustível.
- estabelecimento: nome fantasia se houver (ex.: "KACUA", "Outback"), senão razão social, curto.
- pagamentos: cada linha de FORMA DE PAGAMENTO com seu valor, na ordem da nota (ex.: [{"forma":"Cartão de Crédito","valor":126.55},{"forma":"PIX","valor":252}]). Repita linhas iguais (dois PIX = dois itens). Lista vazia se não houver.
- chave_acesso: os 44 dígitos da chave de acesso da NFC-e, só números, se legível; senão null. numero_nota: número da NFC-e/nota.
- confianca "baixa" se ilegível, cortada ou não for comprovante; explique em "aviso" numa frase curta.`;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:ac.signal,headers:{"content-type":"application/json","x-api-key":cfg.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:cfg.model||MODELS[0][0],max_tokens:1200,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:await blobToB64(blob)}},{type:"text",text:prompt}]}]})});
    if(!res.ok){const m={401:"Chave da API inválida. Confira em Ajustes.",429:"Muitas leituras seguidas ou sem crédito na API. Preencha à mão."}[res.status];show("low",m||"A leitura falhou ("+res.status+"). Preencha à mão.");return}
    const j=await res.json();const txt=(j.content||[]).map(c=>c.text||"").join("");
    const out=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    if(f.val.value===typed.val&&out.valor_total>0)f.val.value=moneyInput(out.valor_total);
    if(out.data&&/^\d{4}-\d{2}-\d{2}$/.test(out.data))f.dt.value=out.data;
    if(f.est.value===typed.est&&out.estabelecimento)f.est.value=out.estabelecimento;
    if(out.categoria&&CATS.includes(out.categoria))f.cat.value=out.categoria;
    if(out.cnpj)f.it.cnpj=out.cnpj;
    const cfgA=CFG.get();const alcOn=cfgA.excluirAlcool!==false;
    const itensA=Array.isArray(out.itens_alcool)?out.itens_alcool.filter(x=>x&&Number(x.valor)>0&&!/\b(etanol|gasolina|diesel|alcool gel|álcool gel)\b/i.test(x.descricao||"")).map(x=>({descricao:String(x.descricao||"Bebida"),valor:r2(x.valor),duvida:!!x.duvida})):[];
    let alcMsg="";
    if(alcOn&&itensA.length){
      const fator=fatorGorjeta(out);const c=calcAlcool(itensA,fator);
      f.it.itensAlcool=c.lista;f.it.taxaFator=fator;f.alc.value=moneyInput(c.valor);f.renderAlcList(c.lista);
      alcMsg=" "+itensA.length+" bebida(s) alcoólica(s) retirada(s): -"+brl(c.valor)+(itensA.some(x=>x.duvida)?" (confira os marcados)":"")+".";
    }
    const pags=Array.isArray(out.pagamentos)?out.pagamentos.filter(p=>p&&Number(p.valor)>0).map(p=>({forma:String(p.forma||"Pagamento").replace(/cart[aã]o de /i,""),valor:r2(p.valor),sel:false})):[];
    f.it.pagamentos=pags;
    if(pags.length>1){f.it.dividida=true;f.it.pessoas=pags.length;f.minha.value="";alcMsg+=" Conta paga em "+pags.length+" partes: marque a sua.";}
    f.renderSplit();f.recalc();
    const chave=String(out.chave_acesso||"").replace(/\D/g,"");
    f.it.chave=chave.length===44?chave:null;f.it.numeroNota=out.numero_nota?String(out.numero_nota).replace(/\D/g,"").replace(/^0+/,""):null;
    try{
      const all=await DB.allItems();const cn=String(out.cnpj||"").replace(/\D/g,"");
      const dup=all.find(x=>(f.it.chave&&x.chave===f.it.chave)||(f.it.numeroNota&&cn&&x.numeroNota===f.it.numeroNota&&String(x.cnpj||"").replace(/\D/g,"")===cn));
      if(dup){const rp=S.reports.find(r=>r.id===dup.rid);f.it._dup=rp?rp.titulo:"outra prestação";alcMsg+=" Atenção: esta nota já foi lançada em “"+f.it._dup+"”."}
    }catch(_){}
    f.recalc();
    if(out.confianca==="baixa"||!(out.valor_total>0))show("low",out.aviso||"Não consegui ler o valor com segurança. Confira e preencha.");
    else show(out.confianca==="alta"&&!/confira|Atenção|marque/.test(alcMsg)?"ok":"low",(out.confianca==="alta"?"Nota lida.":"Leitura parcial.")+alcMsg+" Confira antes de salvar.");
  }catch(err){if(err&&err.name==="AbortError")return;show("low","Não consegui ler a nota. Preencha à mão.")}
}

async function exportPDF(){
  if(!window.jspdf){toast("Gerador de PDF não carregou. Abra o app com internet uma vez.");return}
  let out;try{out=await buildPDF()}catch(e){toast("Não consegui gerar o PDF");return}
  const file=new File([out.blob],out.name,{type:"application/pdf"});
  const share=navigator.canShare&&navigator.canShare({files:[file]});
  const download=()=>{const u=URL.createObjectURL(out.blob);const a=el("a",{href:u,download:out.name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)};
  const sc=sheet(el("h2",{},"PDF pronto"),el("p",{class:"note",style:"margin:0"},out.name+" · "+(out.blob.size/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB"),
    el("div",{class:"actions"},
      el("button",{class:"btn second",onclick:()=>{download();sc.remove()}},ico(I.pdf),"Baixar"),
      share?el("button",{class:"btn primary",onclick:async()=>{try{await navigator.share({files:[file],title:out.name})}catch(_){}sc.remove()}},ico(I.share),"Enviar / Salvar em Arquivos"):null));
}

/* ---------- fotos ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);URL.revokeObjectURL(u)};i.onerror=rej;i.src=u})}
function draw(img,max){const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
const toBlob=(c,q)=>new Promise(r=>c.toBlob(r,"image/jpeg",q));
async function onPhoto(e){
  const file=e.target.files&&e.target.files[0];e.target.value="";if(!file||!S.current)return;
  let img;try{img=await loadImg(file)}catch(_){toast("Não consegui abrir essa imagem");return}
  const foto=await toBlob(draw(img,2400),.82);
  const ocr=await toBlob(draw(img,1600),.85);
  const thumb=draw(img,160).toDataURL("image/jpeg",.7);
  itemSheet({foto,thumb},ocr);
}
$("#fileCam").addEventListener("change",onPhoto);$("#fileGal").addEventListener("change",onPhoto);
$("#btnLista").addEventListener("click",async()=>{await loadReports();renderList()});
$("#btnAjustes").append(ico(I.gear));$("#btnAjustes").addEventListener("click",settingsSheet);

/* ---------- início ---------- */
(async()=>{
  try{await DB.open()}catch(e){$("#view").replaceChildren(el("div",{class:"banner"},"Este navegador não permite salvar dados. Abra pelo Safari ou Chrome, fora da janela anônima."));return}
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  await loadReports();
  const open=S.reports.find(r=>r.status==="aberta");
  if(open)openReport(open);else renderList();
  if(!CFG.get().apiKey&&!CFG.get().avisoKey){CFG.set({avisoKey:1});setTimeout(()=>toast("Para ler as notas automaticamente, coloque sua chave da API em Ajustes",4500),800)}
})();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
